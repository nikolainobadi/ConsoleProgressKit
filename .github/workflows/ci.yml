name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Display Xcode Version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v3
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Display Swift Version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run Tests
        run: swift test
